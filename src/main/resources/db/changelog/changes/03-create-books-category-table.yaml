databaseChangeLog:
  - changeSet:
      id: create-books-category-table
      author: Andrii
      changes:
        - createTable:
            tableName: books_category
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: books_category
            columnNames: book_id, category_id

        - addForeignKeyConstraint:
            baseTableName: books_category
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_books_category_category

        - addForeignKeyConstraint:
            baseTableName: books_category
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_books_category_books