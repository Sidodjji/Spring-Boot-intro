databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: Andrii
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: role
                  type: ENUM('USER','ADMIN')
                  constraints:
                    nullable: false
                    unique: true